[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-council"
version = "2.0.0"
description = "Autonomous Multi-Agent Simulation Engine"
authors = [
    {name = "Iron Council Team", email = "dev@ironcouncil.ai"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.4.0",
    "chromadb>=0.4.22",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "websockets>=14.0,<16.0",
]

[project.scripts]
iron-council = "server:run_cli"  # We'll need to add this entry point to server.py

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "memory*", "utils*", "server.py", "setup_env.py", "reset.py"]
